<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ModSwap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238b5cf6'/%3E%3Cpath d='M9 12h11l-3-3M23 20H12l3 3' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div id="app">
  <aside id="side">
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h12l-3-3M19 15H7l3 3"/></svg></div>
      <div><b>ModSwap</b><small>swap any character model</small></div>
    </div>
    <div class="side-actions">
      <button class="btn pri" id="scan"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Scan Steam</span></button>
      <button class="btn" id="addbtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Add .exe</span></button>
    </div>
    <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search your games" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
    <div id="games"></div>
    <div class="side-foot" id="foot">Runs entirely on your PC.</div>
  </aside>
  <main id="main">
    <div class="empty" id="empty">
      <div class="hero">
        <h1>Put any character<br>into any game.</h1>
        <p>Scan your library, pick a character, drop in a model and fit it live in 3D. ModSwap detects the engine, rigs your model onto the skeleton and installs the mod for you.</p>
        <div class="row"><button class="btn pri big" style="width:auto;padding:13px 22px" id="scan2">Scan my Steam library</button><button class="btn big" style="width:auto;padding:13px 22px" id="add2">Add a game by .exe</button></div>
        <div class="fmtstrip" id="fmts"></div>
      </div>
    </div>
    <div id="work" class="hidden"></div>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
